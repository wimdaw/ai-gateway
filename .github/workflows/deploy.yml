name: Deploy to Koyeb

on:
  push:
    branches: [koyeb]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Koyeb Redeploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          if [ -z "$KOYEB_TOKEN" ]; then
            echo "::error::KOYEB_TOKEN secret is not set"
            exit 1
          fi
          # 直接用 Koyeb API 触发重部署，避免 CLI 安装脚本在 Actions 中失败
          curl -fsS -X POST "https://app.koyeb.com/v1/services/1885a91f-4dd4-4e05-8388-19c90ffcf5cb/redeploy" \
            -H "Authorization: Bearer $KOYEB_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}'
